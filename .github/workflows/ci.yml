name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend build
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Cargo fmt
        run: cargo fmt --all -- --check

      - name: Cargo clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Cargo test
        run: cargo test --locked

      - name: Cargo release build
        run: cargo build --locked --release

      - name: Frontend lint
        working-directory: frontend
        run: npm run lint

      - name: Frontend check
        working-directory: frontend
        run: npm run check

  docker:
    name: docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build image
        run: docker build -f deploy/Dockerfile -t flyscanner:ci .

      - name: Smoke (demo, short)
        run: |
          docker run --rm -d --name flyscanner-ci \
            -e FLYSCANNER_DEMO=true \
            -e FLYSCANNER_LISTEN=0.0.0.0:8080 \
            -p 18080:8080 \
            flyscanner:ci
          for i in $(seq 1 30); do
            if curl -fsS "http://127.0.0.1:18080/api/aircraft" >/dev/null; then
              echo "ok"
              docker stop flyscanner-ci
              exit 0
            fi
            sleep 1
          done
          docker logs flyscanner-ci || true
          docker stop flyscanner-ci || true
          exit 1
